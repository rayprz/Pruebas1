# Reverse proxy for the Fleet Decision Tool: forwards to the `web` service and
# adds hardened security headers. TLS is either terminated here (uncomment the
# 443 block + mount certs) or by a corporate load balancer in front.

# Shared security headers (applied on every response).
map $sent_http_content_type $fleet_csp {
  default "default-src 'self'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";
}

upstream fleet_web {
  server web:3000;
}

server {
  listen 80;
  server_name _;

  # Once TLS is configured below, force HTTPS:
  # return 301 https://$host$request_uri;

  client_max_body_size 12m;  # Excel/CSV imports

  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy $fleet_csp always;

  location / {
    proxy_pass http://fleet_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}

