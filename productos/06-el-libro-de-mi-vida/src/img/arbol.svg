<svg xmlns="http://www.w3.org/2000/svg" width="700" height="520" viewBox="0 0 700 520"
     font-family="DejaVu Sans">
  <!-- Árbol genealógico para llenar a mano -->
  <g stroke="#b08d3f" stroke-width="2" fill="none">
    <path d="M95 96 V 140 M265 96 V 140 M95 140 H 265 M180 140 V 196"/>
    <path d="M435 96 V 140 M605 96 V 140 M435 140 H 605 M520 140 V 196"/>
    <path d="M180 268 V 320 M520 268 V 320 M180 320 H 520 M350 320 V 360"/>
  </g>
  <g fill="#fffdf8" stroke="#7a3b4f" stroke-width="2">
    <rect x="20"  y="40" width="150" height="56" rx="8"/>
    <rect x="190" y="40" width="150" height="56" rx="8"/>
    <rect x="360" y="40" width="150" height="56" rx="8"/>
    <rect x="530" y="40" width="150" height="56" rx="8"/>
    <rect x="100" y="196" width="160" height="72" rx="8"/>
    <rect x="440" y="196" width="160" height="72" rx="8"/>
    <rect x="250" y="360" width="200" height="80" rx="10"/>
  </g>
  <g fill="#9a7c84" font-size="13" text-anchor="middle">
    <text x="95"  y="58">Mi abuelo paterno</text>
    <text x="265" y="58">Mi abuela paterna</text>
    <text x="435" y="58">Mi abuelo materno</text>
    <text x="605" y="58">Mi abuela materna</text>
    <text x="180" y="214">Mi padre</text>
    <text x="520" y="214">Mi madre</text>
    <text x="350" y="380">Yo</text>
  </g>
  <g stroke="#d8c4ca" stroke-width="1.4">
    <path d="M32 84 H 158 M202 84 H 328 M372 84 H 498 M542 84 H 668"/>
    <path d="M112 248 H 248 M452 248 H 588"/>
    <path d="M265 420 H 435"/>
  </g>
  <text x="350" y="492" fill="#7a3b4f" font-size="15" text-anchor="middle"
        font-style="italic">Y de estas raíces siguen creciendo ramas: mis hijos, mis nietos...</text>
</svg>
