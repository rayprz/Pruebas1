<rect x="35" y="36" width="210" height="44" fill="#155e63"/>
<text x="48" y="64" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#fdf3e3">Las palomitas</text>
<rect x="58" y="104" width="174" height="44" rx="10" fill="#dcf3e6"/>
<text x="70" y="124" font-family="DejaVu Sans" font-size="13" fill="#2c3b46">Buenos días, mija</text>
<text x="196" y="140" font-family="DejaVu Sans" font-size="15" fill="#8b9aa5">✓</text>
<text x="70" y="174" font-family="DejaVu Sans" font-size="13.5" fill="#155e63" font-weight="bold">Una palomita: ya salió</text>
<text x="70" y="190" font-family="DejaVu Sans" font-size="13.5" fill="#155e63">de su teléfono.</text>
<rect x="58" y="208" width="174" height="44" rx="10" fill="#dcf3e6"/>
<text x="70" y="228" font-family="DejaVu Sans" font-size="13" fill="#2c3b46">¿Vienes el domingo?</text>
<text x="188" y="244" font-family="DejaVu Sans" font-size="15" fill="#8b9aa5">✓✓</text>
<text x="70" y="278" font-family="DejaVu Sans" font-size="13.5" fill="#155e63" font-weight="bold">Dos grises: ya llegó</text>
<text x="70" y="294" font-family="DejaVu Sans" font-size="13.5" fill="#155e63">al teléfono del otro.</text>
<rect x="58" y="312" width="174" height="44" rx="10" fill="#dcf3e6"/>
<text x="70" y="332" font-family="DejaVu Sans" font-size="13" fill="#2c3b46">Te mando las fotos</text>
<text x="188" y="348" font-family="DejaVu Sans" font-size="15" fill="#34b7f1" font-weight="bold">✓✓</text>
<text x="70" y="382" font-family="DejaVu Sans" font-size="13.5" fill="#155e63" font-weight="bold">Dos azules: ya lo leyó.</text>
<text x="140" y="425" font-family="DejaVu Sans" font-size="12.5" fill="#155e63" text-anchor="middle">Miden aparatos, no cariños </text>

